name: Supabase Heartbeat

on:
  workflow_dispatch:
  schedule:
    # Run every Monday, Wednesday, and Friday at 16:15 UTC.
    - cron: "15 16 * * 1,3,5"

jobs:
  ping:
    name: Keep Supabase project active
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping permissions database
        run: |
          set -euo pipefail

          SUPABASE_URL="$(grep -o 'url: "[^"]*' app-config.js | head -n 1 | sed 's/url: "//')"
          SUPABASE_ANON_KEY="$(grep -o 'anonKey: "[^"]*' app-config.js | head -n 1 | sed 's/anonKey: "//')"

          if [ -z "${SUPABASE_URL}" ]; then
            echo "Supabase URL is missing from app-config.js."
            exit 1
          fi

          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Supabase anon key is missing from app-config.js."
            exit 1
          fi

          curl --fail --show-error --silent \
            "${SUPABASE_URL}/rest/v1/permission_activities?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            --output /tmp/supabase-heartbeat.json

          echo "Supabase heartbeat succeeded."
